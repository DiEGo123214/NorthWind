<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NorthWind.Sales.BlazorClient</title>
    <base href="/" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <!-- html2pdf for direct client-side PDF downloads -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- If you add any scoped CSS files, uncomment the following to load them -->
    <link href="NorthWind.Sales.BlazorClient.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
    <style>
        .html2pdf__overlay {
            z-index: 9999999 !important;
        }
    </style>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>
        window.downloadInvoicePdf = function (elementId, filename) {
            try {
                var element = document.getElementById(elementId);
                if (!element) {
                    console.warn("Elemento no encontrado inmediatamente para exportar a PDF: " + elementId);
                    return;
                }

                var opt = {
                    margin: [8, 8, 8, 8],
                    filename: filename || 'Factura_Venta.pdf',
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { 
                        scale: 2, 
                        useCORS: true, 
                        logging: false,
                        scrollY: 0,
                        scrollX: 0
                    },
                    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
                    pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
                };

                html2pdf().set(opt).from(element).save();
            } catch (err) {
                console.error("Error al descargar PDF:", err);
            }
        };

        window.printInvoice = function (elementId) {
            try {
                var element = document.getElementById(elementId);
                if (!element) {
                    window.print();
                    return;
                }

                var printWindow = window.open('', '_blank', 'width=900,height=700');
                if (!printWindow) {
                    window.print();
                    return;
                }

                printWindow.document.open();
                printWindow.document.write('<!DOCTYPE html><html><head><title>Imprimir Factura</title>');
                printWindow.document.write('<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css">');
                printWindow.document.write('<style>body{padding:25px;background:white;font-family:system-ui,-apple-system,sans-serif;}@page{size:auto;margin:10mm;}.table th,.table td{padding:0.4rem;}</style>');
                printWindow.document.write('</head><body>');
                printWindow.document.write(element.outerHTML);
                printWindow.document.write('</body></html>');
                printWindow.document.close();

                printWindow.focus();
                setTimeout(function () {
                    try {
                        printWindow.print();
                    } catch (e) {
                        console.error(e);
                    }
                }, 500);
            } catch (err) {
                console.error("Error al imprimir:", err);
                window.print();
            }
        };
    </script>
</body>

</html>
